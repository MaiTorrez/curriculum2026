        @import url('https://fonts.googleapis.com/css2?family=Rosario:ital,wght@0,300..700;1,300..700&display=swap');

<body class="contacto-body">

    <header>
        <a href="index.html">
            <img class="estrella-header" src="img/svg/logo_header.svg" alt="mairatorrezlogo" width="54" height="57" />
        </a>
        <nav>
            <a class="botonera" href="portfolio.html">Portfolio</a>
            <a class="botonera" href="curriculum.html">Curriculum</a>
            <a class="botonera" href="contacto.html">Contacto</a>
        </nav>

    </header>

    <main class="main-contacto">
        <section class="idea">
            <h1 class="h1-violeta">Mi contacto! </h1>
            <h2 class="h2-negro">¿Tenés una idea?</h2>
            <h3 class="h3-negro">Podés mandarme un mensaje, no muerdo</h3>
        </section>
        <form method="post" action="" target="_blank" enctype="text/plain">
            <section>
                <div>
                    <label for="nombre">tu nombre*</label>
                    <input type="text" name="nombre" id="nombre" maxlength="30" placeholder="Cosme Fulanito" required>
                </div>
                <div>
                    <label for="email">tu email*</label>
                    <input type="email" name="email" id="email" placeholder="señorthomsom@gmail.com" required>
                </div>
            </section>
            <div class="check-list">
                <label>Diseño gráfico <input type="checkbox" name="servicio" value="Diseño Gráfico" id="diseño"></label>
                <label>Fotografía<input type="checkbox" name="servicio" value="Fotografía" id="fotografia"></label>
                <label>Ilustración<input type="checkbox" name="servicio" value="Ilustración" id="ilustración"></label>
            </div>

            <div>
                <label>contame tus ideas</label>
                <textarea name="mensaje" id="mensaje"></textarea>
            </div>

            <input type="submit" value="Enviar" class="button-enviar">

        </form>
    </main>
    <footer>
        <p>Computación III - 1er cuatrimestre 2026 - Cátedra Wischñevsky</p>
        <img class="estrella-footer" src="img/svg/ochopuntas.svg" alt="icon-estrella-ocho-puntas" width="64" height="69" />

            <p>Chusmeá mis redes sociales!</p>
            <ul class="redes">
                <li>
                    <a href="https://www.behance.net/mairav" target="_blank">
                        <img src="img/svg/redes_behance.svg" alt="behance-logo" width="37" height="36">
                    </a>
                </li>
                <li>
                    <a href="https://www.instagram.com/torrezconz_?igsh=MXIzZGVwbGYzOGRzbA==" target="_blank">
                        <img src="img/svg/redes_ig.svg" alt="instagram-logo" width="37" height="36">
                    </a>
                </li>
            </ul>
        </div>
    </footer>
